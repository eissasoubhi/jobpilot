name: Staging V1 readiness

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Immutable 40-character candidate SHA (blank = selected ref SHA)'
        required: false
        type: string
      run_persistence:
        description: 'Exercise persistence across container replacement'
        required: true
        default: true
        type: boolean
      run_restore:
        description: 'Exercise backup + destructive-in-staging restore'
        required: true
        default: false
        type: boolean
      run_rollback:
        description: 'Exercise rollback to rollback_sha and redeploy candidate'
        required: true
        default: false
        type: boolean
      rollback_sha:
        description: 'Known-good 40-character SHA required when rollback is enabled'
        required: false
        type: string
      run_alert_path:
        description: 'Require JobPilot to report a fresh alert-webhook delivery'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: staging-v1-readiness
  cancel-in-progress: false

jobs:
  staging-readiness:
    name: Exercise real staging readiness
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH || 'jobpilot-staging' }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve candidate and validate staging configuration
        shell: bash
        env:
          CANDIDATE_INPUT: ${{ inputs.candidate_sha }}
          ROLLBACK_INPUT: ${{ inputs.rollback_sha }}
          RUN_ROLLBACK: ${{ inputs.run_rollback }}
        run: |
          set -euo pipefail

          candidate="${CANDIDATE_INPUT:-$GITHUB_SHA}"
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a 40-character lowercase git SHA."
            exit 1
          fi

          rollback="${ROLLBACK_INPUT:-}"
          if [[ "$RUN_ROLLBACK" == "true" && ! "$rollback" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::rollback_sha is required and must be a 40-character lowercase git SHA when rollback is enabled."
            exit 1
          fi

          [[ -n "$STAGING_SSH_HOST" ]] || { echo "::error::Set staging variable STAGING_SSH_HOST."; exit 1; }
          [[ -n "$STAGING_SSH_USER" ]] || { echo "::error::Set staging variable STAGING_SSH_USER."; exit 1; }
          [[ "$STAGING_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::STAGING_SSH_PORT must be numeric."; exit 1; }
          [[ "$STAGING_DEPLOY_PATH" =~ ^[A-Za-z0-9._/-]+$ && "$STAGING_DEPLOY_PATH" != *".."* ]] || {
            echo "::error::STAGING_DEPLOY_PATH must be a simple relative/absolute path without '..'."
            exit 1
          }
          [[ -n "$STAGING_SSH_PRIVATE_KEY" ]] || { echo "::error::Set staging secret STAGING_SSH_PRIVATE_KEY."; exit 1; }
          [[ -n "$STAGING_SSH_KNOWN_HOSTS" ]] || { echo "::error::Set staging secret STAGING_SSH_KNOWN_HOSTS."; exit 1; }
          [[ -n "$STAGING_ENV_FILE" ]] || { echo "::error::Set staging secret STAGING_ENV_FILE."; exit 1; }

          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "ROLLBACK_SHA=$rollback" >> "$GITHUB_ENV"
          echo "EVIDENCE_FILE=$RUNNER_TEMP/jobpilot-v1-staging-evidence.md" >> "$GITHUB_ENV"

          {
            echo "# JobPilot V1 staging readiness evidence"
            echo
            echo "- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Started (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Workflow ref SHA: $GITHUB_SHA"
            echo "- Candidate image SHA: $candidate"
            echo "- Persistence requested: ${{ inputs.run_persistence }}"
            echo "- Restore requested: ${{ inputs.run_restore }}"
            echo "- Rollback requested: ${{ inputs.run_rollback }}"
            echo "- Alert-path requested: ${{ inputs.run_alert_path }}"
            if [[ -n "$rollback" ]]; then
              echo "- Rollback SHA: $rollback"
            fi
            echo
            echo "This artifact contains operational results only. Secrets, webhook URLs and private data are intentionally excluded."
          } > "$RUNNER_TEMP/jobpilot-v1-staging-evidence.md"

      - name: Configure pinned SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/jobpilot_staging"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host jobpilot-staging
            HostName $STAGING_SSH_HOST
            User $STAGING_SSH_USER
            Port $STAGING_SSH_PORT
            IdentityFile $HOME/.ssh/jobpilot_staging
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/jobpilot_staging" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
          ssh jobpilot-staging 'printf "SSH staging access verified.\n"'

      - name: Verify immutable candidate images exist
        uses: docker/setup-buildx-action@v3

      - name: Inspect immutable image manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ROLLBACK: ${{ inputs.run_rollback }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          shas=("$CANDIDATE_SHA")
          if [[ "$RUN_ROLLBACK" == "true" ]]; then
            shas+=("$ROLLBACK_SHA")
          fi
          for sha in "${shas[@]}"; do
            for image in               ghcr.io/eissasoubhi/jobpilot-prod-api               ghcr.io/eissasoubhi/jobpilot-prod-web               ghcr.io/eissasoubhi/jobpilot-prod-browser-worker
            do
              docker buildx imagetools inspect "$image:$sha" >/dev/null
            done
          done
          echo "- Immutable image manifests: PASS" >> "$EVIDENCE_FILE"

      - name: Upload deployment contract and protected staging env
        shell: bash
        run: |
          set -euo pipefail
          ssh jobpilot-staging "mkdir -p -- '$STAGING_DEPLOY_PATH'"
          scp             deploy/compose.yml             deploy/Caddyfile             deploy/deploy.sh             deploy/backup.sh             deploy/restore.sh             deploy/verify-alert-path.sh             deploy/verify-persistence.sh             deploy/.env.example             "jobpilot-staging:$STAGING_DEPLOY_PATH/"

          umask 077
          printf '%s' "$STAGING_ENV_FILE" > "$RUNNER_TEMP/staging.env"
          scp "$RUNNER_TEMP/staging.env" "jobpilot-staging:$STAGING_DEPLOY_PATH/.env"

          ssh jobpilot-staging "cd '$STAGING_DEPLOY_PATH' && chmod 600 .env && chmod +x deploy.sh backup.sh restore.sh verify-alert-path.sh verify-persistence.sh"
          ssh jobpilot-staging "cd '$STAGING_DEPLOY_PATH' && grep -Fxq 'JOBPILOT_DEPLOYMENT_ENV=staging' .env" || {
            echo "::error::STAGING_ENV_FILE must contain JOBPILOT_DEPLOYMENT_ENV=staging."
            exit 1
          }

      - name: Authenticate staging to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | ssh jobpilot-staging "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin >/dev/null"

      - name: Deploy exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          if ssh jobpilot-staging "cd '$STAGING_DEPLOY_PATH' && ./deploy.sh '$CANDIDATE_SHA'"; then
            echo "- Candidate deployment + Compose health checks: PASS" >> "$EVIDENCE_FILE"
          else
            echo "- Candidate deployment + Compose health checks: FAIL" >> "$EVIDENCE_FILE"
            exit 1
          fi

      - name: Exercise persistence across container replacement
        if: ${{ inputs.run_persistence }}
        shell: bash
        run: |
          set -euo pipefail
          if ssh jobpilot-staging "cd '$STAGING_DEPLOY_PATH' && ./verify-persistence.sh --confirm-staging"; then
            echo "- Persistence across container replacement: PASS" >> "$EVIDENCE_FILE"
          else
            echo "- Persistence across container replacement: FAIL" >> "$EVIDENCE_FILE"
            exit 1
          fi

      - name: Exercise operational backup and restore
        if: ${{ inputs.run_restore }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(ssh jobpilot-staging "cd '$STAGING_DEPLOY_PATH' && ./backup.sh")"
          printf '%s\n' "$output"
          backup_path="$(printf '%s\n' "$output" | sed -n 's/^Backup created: //p' | tail -n 1)"
          [[ -n "$backup_path" && "$backup_path" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "::error::Could not resolve the staging backup path safely."
            echo "- Operational backup + restore: FAIL (backup path)" >> "$EVIDENCE_FILE"
            exit 1
          }
          if ssh jobpilot-staging "cd '$STAGING_DEPLOY_PATH' && ./restore.sh '$backup_path' --confirm-restore"; then
            echo "- Operational backup + restore: PASS" >> "$EVIDENCE_FILE"
          else
            echo "- Operational backup + restore: FAIL" >> "$EVIDENCE_FILE"
            exit 1
          fi

      - name: Exercise rollback and forward recovery
        if: ${{ inputs.run_rollback }}
        shell: bash
        run: |
          set -euo pipefail
          if ssh jobpilot-staging "cd '$STAGING_DEPLOY_PATH' && ./deploy.sh '$ROLLBACK_SHA'"             && ssh jobpilot-staging "cd '$STAGING_DEPLOY_PATH' && ./deploy.sh '$CANDIDATE_SHA'"; then
            echo "- Rollback to $ROLLBACK_SHA and forward recovery to $CANDIDATE_SHA: PASS" >> "$EVIDENCE_FILE"
          else
            echo "- Rollback/forward recovery: FAIL" >> "$EVIDENCE_FILE"
            exit 1
          fi

      - name: Exercise connector alert path
        if: ${{ inputs.run_alert_path }}
        shell: bash
        run: |
          set -euo pipefail
          if ssh jobpilot-staging "cd '$STAGING_DEPLOY_PATH' && ./verify-alert-path.sh"; then
            {
              echo "- JobPilot fresh alert-webhook delivery: PASS"
              echo "- External receiver/signature confirmation: REQUIRED before this counts as final alert-path evidence"
            } >> "$EVIDENCE_FILE"
          else
            echo "- JobPilot fresh alert-webhook delivery: FAIL" >> "$EVIDENCE_FILE"
            exit 1
          fi

      - name: Record completion
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo
            echo "- Completed (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Workflow result: PASS"
          } >> "$EVIDENCE_FILE"

      - name: Logout staging from GHCR
        if: ${{ always() }}
        shell: bash
        run: ssh jobpilot-staging 'docker logout ghcr.io >/dev/null 2>&1 || true' || true

      - name: Upload V1 staging evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jobpilot-v1-staging-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: warn
          retention-days: 30
