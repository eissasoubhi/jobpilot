name: Storybook

on:
  pull_request:
    branches: [source]
    paths:
      - 'web/**'
      - '.github/workflows/storybook.yml'
  push:
    branches: [source]
    paths:
      - 'web/**'
      - '.github/workflows/storybook.yml'

concurrency:
  group: storybook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build Storybook
        run: npm run build-storybook
      - name: Reclaim Storybook workspace artifacts
        if: always()
        run: rm -rf node_modules storybook-static
