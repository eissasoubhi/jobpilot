name: Deployment images

on:
  pull_request:
    paths:
      - 'api/**'
      - 'web/**'
      - 'browser-worker/**'
      - 'initial-data/**'
      - 'deploy/**'
      - '.github/workflows/deploy-images.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deployment-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    name: Validate deployment Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yml config --quiet
      - name: Validate deployment scripts
        run: sh -n deploy/deploy.sh deploy/backup.sh

  build:
    name: Build ${{ matrix.name }}
    needs: validate-compose
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jobpilot-prod-api
            context: .
            file: api/Dockerfile.prod
            image: ghcr.io/eissasoubhi/jobpilot-prod-api
          - name: jobpilot-prod-web
            context: .
            file: web/Dockerfile.prod
            image: ghcr.io/eissasoubhi/jobpilot-prod-web
          - name: jobpilot-prod-browser-worker
            context: browser-worker
            file: browser-worker/Dockerfile
            image: ghcr.io/eissasoubhi/jobpilot-prod-browser-worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
